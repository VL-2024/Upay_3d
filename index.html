<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>УПАЙ v0.1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#08131f;touch-action:none}#app{position:relative;width:100%;height:100%}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;z-index:10;pointer-events:none;text-shadow:0 1px 5px #000}.brand{font-size:22px;font-weight:800;letter-spacing:.08em}.status,.debug,.hint{background:rgba(6,18,31,.65);backdrop-filter:blur(8px);border-radius:12px}.status{font-size:12px;padding:7px 10px}.debug{position:absolute;left:10px;top:58px;color:#dce9f5;z-index:10;padding:10px 12px;font-size:12px;line-height:1.45;min-width:195px;pointer-events:none}.controls{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px;z-index:20}.controls button{border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.28)}#scatterBtn{background:#e7c36a;color:#152334}#resetBtn{background:rgba(255,255,255,.9);color:#152334}#debugBtn{background:rgba(23,54,93,.92);color:#fff}.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:82px;z-index:10;color:#fff;padding:8px 12px;font-size:12px;pointer-events:none;text-align:center;min-width:240px}@media(min-width:900px){#app{max-width:520px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.45)}body{background:#10151b}}
</style></head>
<body><div id="app"><canvas id="renderCanvas"></canvas><div class="top"><div class="brand">УПАЙ</div><div class="status">v0.1 • Babylon.js + Havok</div></div><div class="debug"><div><b>FPS:</b> <span id="fps">—</span></div><div><b>Состояние:</b> <span id="gameState">INIT</span></div><div><b>Чүкө:</b> <span id="pieceCount">0</span> + Хан</div><div><b>Пары:</b> <span id="pairCount">0</span></div><div><b>Выбран:</b> <span id="selected">—</span></div></div><div class="hint" id="hint">Нажмите «РАССЫПАТЬ». Затем выберите чүкө и подсвеченную цель.</div><div class="controls"><button id="scatterBtn">РАССЫПАТЬ</button><button id="resetBtn">СБРОС</button><button id="debugBtn">DEBUG: ON</button></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script><script type="module" src="./src/main.js"></script></body></html>
